{% extends "base.html" %}
{% block content %}
<div class="pf-v5-l-bullseye">
  <div class="pf-v5-c-card" style="max-width: 1100px; width: 100%;">
    <div class="pf-v5-c-card__header"><h1>Search</h1></div>
    <div class="pf-v5-c-card__body pf-v5-l-split pf-m-gutter" style="gap: 1.5rem;">
      <div class="pf-v5-l-stack pf-m-gutter" style="flex: 2; min-width: 460px;">
        <div id="chat-messages">
          {% include 'search/chat_messages.html' %}
        </div>
        
        <!-- Sources panel - shown after answer -->
        <div id="sources-panel" style="display: none;">
          <div class="pf-v5-c-card" style="background: #21262d; border: 1px solid #30363d;">
            <div class="pf-v5-c-card__header" style="padding: 0.75rem 1rem;">
              <h3 style="margin: 0; font-size: 14px; color: #8b949e;">
                <i class="fas fa-book-open" style="margin-right: 0.5rem;"></i>Sources Referenced
              </h3>
            </div>
            <div class="pf-v5-c-card__body" id="sources-list" style="padding: 0.5rem 1rem;">
              <!-- Citations will be inserted here -->
            </div>
          </div>
        </div>
        
        <div id="status-panel" style="display: none; padding: 1rem; background: #1e1e2e; border-radius: 6px; margin-bottom: 1rem;">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span id="status-spinner" style="display: inline-block; width: 16px; height: 16px; border: 2px solid #666; border-top-color: #58a6ff; border-radius: 50%; animation: spin 1s linear infinite;"></span>
            <span id="status-text" style="color: #c9d1d9; font-weight: 500;">Initializing…</span>
          </div>
        </div>
        <form id="chat-form" class="pf-v5-c-form pf-m-horizontal" onsubmit="event.preventDefault(); streamChat();">
          <div class="pf-v5-c-form__group">
            <div class="pf-v5-c-form__group-label"><label class="pf-v5-c-form__label" for="message"><span class="pf-v5-c-form__label-text">Your question</span></label></div>
            <div class="pf-v5-c-form__group-control"><textarea id="message" name="message" class="pf-v5-c-form-control" rows="3" placeholder="Ask about your knowledge base…" required></textarea></div>
          </div>
          <div class="pf-v5-c-form__group">
            <div class="pf-v5-c-form__group-label"><label class="pf-v5-c-form__label"><span class="pf-v5-c-form__label-text">Notebooks to search</span></label></div>
            <div class="pf-v5-c-form__group-control">
              <div class="pf-v5-l-gallery pf-m-gutter" style="--pf-l-gallery--GridTemplateColumns--min: 220px;">
                {% for nb in service_kb_notebooks %}
                <label class="pf-v5-c-check" for="nb-{{ nb.name }}">
                  <input class="pf-v5-c-check__input" type="checkbox" id="nb-{{ nb.name }}" name="notebooks" value="{{ nb.name }}" {% if nb.name in selected_notebooks %}checked{% endif %}>
                  <span class="pf-v5-c-check__label">{{ nb.label }}</span>
                </label>
                {% endfor %}
              </div>
            </div>
          </div>
          <div class="pf-v5-c-form__group pf-m-action">
            <div class="pf-v5-c-form__group-control">
              <button id="chat-send" type="submit" class="pf-v5-c-button pf-m-primary">Send</button>
              <button id="chat-clear" type="button" class="pf-v5-c-button pf-m-secondary" onclick="clearChat();">Clear</button>
            </div>
          </div>
        </form>
      </div>
      <div class="pf-v5-c-card pf-v5-c-card__body" style="flex: 1; min-width: 320px;">
        <h2>Live Log</h2>
        <div id="live-log" style="max-height: 520px; overflow: auto; background: #0b0d12; color: #c9d1d9; padding: .5rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; border-radius: 4px; min-height: 100px;"></div>
        <button type="button" class="pf-v5-c-button pf-m-link" style="margin-top: 0.5rem;" onclick="document.getElementById('live-log').innerHTML = '';">Clear Log</button>
      </div>
    </div>
  </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
#chat-messages .assistant { white-space: pre-wrap; }
.status-done { color: #3fb950 !important; }
.status-error { color: #f85149 !important; }
.source-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.75rem;
  margin: 0.25rem;
  background: #30363d;
  border-radius: 4px;
  color: #58a6ff;
  text-decoration: none;
  font-size: 13px;
  transition: background 0.2s;
}
.source-link:hover {
  background: #3d444d;
  color: #79c0ff;
}
.source-link .source-type {
  background: #238636;
  color: white;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  text-transform: uppercase;
}
.source-link.note .source-type { background: #8957e5; }
.source-link.insight .source-type { background: #d29922; }
</style>

<script>
function logLine(msg, isError) {
  const el = document.getElementById('live-log');
  const ts = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.style.borderBottom = '1px solid #30363d';
  div.style.padding = '2px 0';
  if (isError) div.style.color = '#f85149';
  div.textContent = `[${ts}] ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function setStatus(text, isDone, isError) {
  const panel = document.getElementById('status-panel');
  const statusText = document.getElementById('status-text');
  const spinner = document.getElementById('status-spinner');
  panel.style.display = 'block';
  statusText.textContent = text;
  if (isDone) {
    spinner.style.display = 'none';
    statusText.classList.add('status-done');
    statusText.classList.remove('status-error');
  } else if (isError) {
    spinner.style.display = 'none';
    statusText.classList.add('status-error');
    statusText.classList.remove('status-done');
  } else {
    spinner.style.display = 'inline-block';
    statusText.classList.remove('status-done', 'status-error');
  }
}

function hideStatus() {
  document.getElementById('status-panel').style.display = 'none';
}

function showSources(citations) {
  const panel = document.getElementById('sources-panel');
  const list = document.getElementById('sources-list');
  
  if (!citations || citations.length === 0) {
    panel.style.display = 'none';
    return;
  }
  
  list.innerHTML = '';
  for (const c of citations) {
    const a = document.createElement('a');
    a.className = `source-link ${c.type}`;
    a.href = c.url || '#';
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `<span class="source-type">${c.type}</span><span>${c.id}</span>`;
    list.appendChild(a);
  }
  panel.style.display = 'block';
}

function hideSources() {
  document.getElementById('sources-panel').style.display = 'none';
}

function appendMessage(role, content) {
  const container = document.getElementById('chat-messages');
  let pane = container.querySelector('.messages');
  if (!pane) {
    pane = document.createElement('div');
    pane.className = 'messages pf-v5-c-card pf-v5-c-card__body';
    pane.style.cssText = 'min-height: 200px; max-height: 420px; overflow: auto;';
    container.appendChild(pane);
  }
  const div = document.createElement('div');
  div.className = role;
  div.innerHTML = content;
  pane.appendChild(div);
  pane.scrollTop = pane.scrollHeight;
}

function clearChat() {
  fetch("{{ url_for('search.chat_clear') }}", {method: 'POST'}).then(r => r.text()).then(html => {
    document.getElementById('chat-messages').innerHTML = html;
  });
  document.getElementById('live-log').innerHTML = '';
  hideStatus();
  hideSources();
}

async function streamChat() {
  const form = document.getElementById('chat-form');
  const sendBtn = document.getElementById('chat-send');
  const data = new FormData(form);
  const msg = (data.get('message') || '').trim();
  if (!msg) return;

  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending…';
  hideSources();

  appendMessage('user pf-v5-c-card pf-v5-c-card__body', `<strong>You</strong><br>` + msg.replace(/</g,'&lt;').replace(/\n/g,'<br>'));
  document.getElementById('message').value = '';

  setStatus('Connecting to server…', false, false);
  logLine('Starting request…');

  let answerDiv = null;
  let answerText = '';

  try {
    const resp = await fetch("{{ url_for('search.chat_stream') }}", {method: 'POST', body: data});
    logLine(`Response status: ${resp.status}`);

    if (!resp.ok) {
      setStatus(`Request failed: ${resp.status}`, false, true);
      logLine(`HTTP error: ${resp.status}`, true);
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
      return;
    }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buffer = '';

    while (true) {
      const {value, done} = await reader.read();
      if (done) {
        logLine('Stream ended');
        break;
      }
      buffer += dec.decode(value, {stream: true});

      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);

        if (!chunk.startsWith('event:')) continue;
        const lines = chunk.split('\n');
        const ev = lines[0].slice(6).trim();
        const rawData = lines[1] ? lines[1].replace(/^data:\s*/, '') : '';

        if (ev === 'status') {
          let statusMsg = rawData;
          try { statusMsg = JSON.parse(rawData); } catch {}
          setStatus(statusMsg, false, false);
          logLine(`Status: ${statusMsg}`);
        } else if (ev === 'log') {
          let logData = rawData;
          try { logData = JSON.parse(rawData); } catch {}
          logLine(logData);
        } else if (ev === 'token') {
          let token = '';
          try { token = JSON.parse(rawData); } catch { token = rawData; }
          if (!answerDiv) {
            answerDiv = document.createElement('div');
            answerDiv.className = 'assistant pf-v5-c-card pf-v5-c-card__body';
            answerDiv.innerHTML = '<strong>Assistant</strong><br><span class="answer-content"></span>';
            const pane = document.getElementById('chat-messages').querySelector('.messages');
            if (pane) pane.appendChild(answerDiv);
          }
          answerText += token;
          answerDiv.querySelector('.answer-content').textContent = answerText;
        } else if (ev === 'done') {
          let payload = {};
          try { payload = JSON.parse(rawData); } catch {}
          const warnings = payload.warnings || [];
          const citations = payload.citations || [];
          
          if (warnings.length) {
            logLine(`Warnings: ${warnings.join(', ')}`);
          }
          
          // Show sources if any
          showSources(citations);
          
          setStatus('Complete', true, false);
          logLine('Done');
        }
      }
    }
  } catch (err) {
    setStatus(`Error: ${err.message}`, false, true);
    logLine(`Exception: ${err.message}`, true);
  }

  sendBtn.disabled = false;
  sendBtn.textContent = 'Send';
}
</script>
{% endblock %}
