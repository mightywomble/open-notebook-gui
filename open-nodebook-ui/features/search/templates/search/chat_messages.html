<div class="messages pf-v5-c-card pf-v5-c-card__body" style="min-height: 200px; max-height: 420px; overflow: auto;">
  {% for m in messages %}
  <div class="{{ m.role }} pf-v5-c-card pf-v5-c-card__body">
    <strong>{{ 'You' if m.role == 'user' else 'Assistant' }}</strong>
    <div>{{ m.content }}</div>
  </div>
  {% endfor %}
</div>
